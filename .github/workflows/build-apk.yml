name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: build-apk-main
  cancel-in-progress: true

permissions:
  contents: write

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Show versions
        run: |
          java -version
          gradle --version

      - name: Bundle Bert-VITS2 personal models
        run: |
          curl -fL --retry 4 --retry-delay 5 \
            -o /tmp/bertvits2.apk \
            https://github.com/Voine/Bert-VITS2-MNN/releases/download/v2.0.0/BertVits2-v2.0.0.apk
          rm -rf /tmp/bertvits2-assets
          unzip -q /tmp/bertvits2.apk 'assets/bert/*' 'assets/bv2_model/*' -d /tmp/bertvits2-assets
          mkdir -p app/src/main/assets
          cp -R /tmp/bertvits2-assets/assets/bert app/src/main/assets/
          cp -R /tmp/bertvits2-assets/assets/bv2_model app/src/main/assets/
          du -sh app/src/main/assets/bert app/src/main/assets/bv2_model

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-companion-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish personal TTS APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=dsh-tts-0.13.1
          APK=app/build/outputs/apk/debug/app-debug.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "DSH Companion 0.13.1 personal Bert-VITS2" \
              --notes "Personal-use build with Bert-VITS2 2.3 demo models. Non-commercial; do not redistribute."
          fi
