name: bailong-pack

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow ftfy

      - name: Download Bailong release
        run: |
          curl -fL --retry 4 --retry-delay 5 \
            -o /tmp/bailong.zip \
            https://github.com/jingh12312-rgb/bailong-desktop-pet/releases/download/v0.4.1/bailong-desktop-pet-v0.4.1-windows-x64.zip
          unzip -q /tmp/bailong.zip -d /tmp/bailong
          echo "=== top ==="
          find /tmp/bailong -maxdepth 3 -type d | head -40
          echo "=== files ==="
          find /tmp/bailong -maxdepth 4 -type f | head -40
          echo "=== outputs ==="
          find /tmp/bailong/BailongPet/outputs -maxdepth 4 -type f | head -80

      - name: Build pack
        run: |
          python3 tools/build_bailong_pack.py --source /tmp/bailong --out build/bailong
          cd build
          zip -qr bailong-character.zip bailong

      - name: Upload pack
        uses: actions/upload-artifact@v4
        with:
          name: bailong-character
          path: build/bailong-character.zip
          if-no-files-found: error
