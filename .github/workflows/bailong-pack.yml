name: bailong-pack

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow ftfy

      - name: Download Bailong release
        run: |
          curl -fL --retry 4 --retry-delay 5 \
            -o /tmp/bailong.zip \
            https://github.com/jingh12312-rgb/bailong-desktop-pet/releases/download/v0.4.1/bailong-desktop-pet-v0.4.1-windows-x64.zip
          rm -rf /tmp/bailong /tmp/bailong-unused
          python3 - <<'PY'
          import pathlib, zipfile
          src = zipfile.ZipFile('/tmp/bailong.zip', metadata_encoding='gbk')
          dest = pathlib.Path('/tmp/bailong')
          for info in src.infolist():
              if info.is_dir():
                  continue
              target = dest / info.filename
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(src.read(info))
          print('extracted', len(src.infolist()))
          PY
          echo "=== top ==="
          find /tmp/bailong -maxdepth 3 -type d | head -40
          echo "=== files ==="
          find /tmp/bailong -maxdepth 4 -type f | head -40
          echo "=== outputs ==="
          find /tmp/bailong/BailongPet/outputs -maxdepth 4 -type f | head -80

      - name: Build pack
        run: |
          python3 tools/build_bailong_pack.py --source /tmp/bailong --out build/bailong
          cd build
          zip -qr bailong-character.zip bailong

      - name: Upload pack
        uses: actions/upload-artifact@v4
        with:
          name: bailong-character
          path: build/bailong-character.zip
          if-no-files-found: error
